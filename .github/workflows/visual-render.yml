name: Visual render

on:
  push:
  pull_request:

concurrency:
  group: visual-render-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  catalog:
    name: カタログ代表レンダー
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node.js 24を準備
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: ライブラリをビルド
        run: npm run build --workspace=remotion-presets

      - name: 全Canvas Effectsを実ブラウザーで検査
        run: node scripts/audit-canvas-effects.mjs --skip-build

      - name: 代表プリセットをレンダー
        run: >-
          node scripts/render-representative-presets.mjs
          --skip-build
          --frame 60
          --scale 0.25
          --output out/visual-smoke

      - name: レンダー結果を保存
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: representative-preset-stills
          path: out/visual-smoke/*.png
          if-no-files-found: error
          retention-days: 7
