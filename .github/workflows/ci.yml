name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 20
          - 22
          - 24

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Node.js ${{ matrix.node-version }} を準備
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: 依存関係をインストール
        run: npm ci

      - name: Remotion公式パッケージのバージョンを検査
        run: |
          node -e "
          const packageJson = require('./apps/studio/package.json');
          const remotionDependencies = Object.entries(packageJson.dependencies).filter(
            ([name]) => name === 'remotion' || name.startsWith('@remotion/'),
          );
          const versions = new Set(remotionDependencies.map(([, version]) => version));
          const version = [...versions][0] ?? '';
          if (versions.size !== 1 || !/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error('Remotion公式パッケージは同一の完全固定バージョンにしてください。');
          }
          "

      - name: 型解決用に公開ライブラリを先行ビルド
        run: npm run build --workspace=remotion-presets

      - name: フォーマットを検査
        run: npm run format:check

      - name: 静的解析を実行
        run: npm run lint

      - name: 型を検査
        run: npm run typecheck

      - name: テストを実行
        run: npm test

      - name: 全workspaceをビルド
        run: npm run build

      - name: npm公開物を検査
        run: npm pack --dry-run --workspace=remotion-presets

      - name: npm tarballを隔離環境で検査
        if: matrix.node-version == 24
        run: npm run test:package -- --skip-build
